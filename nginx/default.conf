server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://n8n-main:5678/webhook/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/api/v1/projects/([^/]+)/documents/uploads$ {
    rewrite ^/api/v1/projects/([^/]+)/documents/uploads$ /webhook/85ba4c5d-cf1f-4fd7-a5d1-978dcbe08be4/api/v1/projects/$1/documents/uploads break;
    proxy_pass http://n8n-main:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/api/v1/projects/([^/]+)$ {
    rewrite ^/api/v1/projects/([^/]+)$ /webhook/2e85de5f-68bf-40f5-a453-67e887731af4/api/v1/projects/$1 break;
    proxy_pass http://n8n-main:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/api/v1/documents/([^/]+)/confirm$ {
