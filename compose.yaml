name: construction-inspection

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
  DB_POSTGRESDB_USER: ${N8N_DB_USER}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_BULL_REDIS_DB: ${REDIS_DB_N8N}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
  GENERIC_TIMEZONE: ${TZ}
  TZ: ${TZ}
  N8N_HOST: ${N8N_HOST}
  N8N_PROTOCOL: ${N8N_PROTOCOL}
  WEBHOOK_URL: ${APP_BASE_URL}/
  N8N_EDITOR_BASE_URL: ${APP_BASE_URL}/n8n/
  N8N_PROXY_HOPS: 1
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: 168

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_READONLY_USER: ${APP_DB_READONLY_USER}
      APP_DB_READONLY_PASSWORD: ${APP_DB_READONLY_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS}
      MINIO_BUCKET_DERIVED: ${MINIO_BUCKET_DERIVED}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS}
    entrypoint: ["/bin/sh", "/init/minio.sh"]
    volumes: [./scripts/minio-init.sh:/init/minio.sh:ro]
    networks: [internal]
    restart: "no"

  db-migrate:
    image: postgres:17.4-alpine
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    volumes: [./db/migrations:/migrations:ro]
    networks: [internal]
    restart: "no"

  pdf-parser:
    build: ./services/pdf-parser
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ocr-service:
    build: ./services/ocr-service
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OCR_LANGUAGES: ${OCR_LANGUAGES}
      OCR_DPI: ${OCR_DPI}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS}
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n-main:
    image: n8nio/n8n:2.6.4
    command: start
    environment: *n8n-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [n8n_data:/home/node/.n8n]
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n-worker:
    image: n8nio/n8n:2.6.4
    command: worker --concurrency=5
    environment: *n8n-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [n8n_data:/home/node/.n8n]
    networks: [internal]
    restart: unless-stopped

  n8n-bootstrap:
    image: n8nio/n8n:2.6.4
    depends_on:
      n8n-main: {condition: service_healthy}
    environment: *n8n-env
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./n8n/workflows:/workflows:ro
      - ./n8n/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - n8n_data:/data
    networks: [internal]
    restart: "no"

  frontend:
    build: ./frontend
    networks: [edge]
    restart: unless-stopped

  nginx:
    image: nginx:1.27.4-alpine
    depends_on:
      frontend: {condition: service_started}
      n8n-main: {condition: service_healthy}
    ports: ["127.0.0.1:80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  n8n_data: {}
